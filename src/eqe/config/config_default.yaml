paths:
  measurements_dir: ~/Documents/EQE/measurements
  calibrations_dir: ~/Documents/EQE/calibrations
  logs_dir: ~/AppData/Local/eqe/logs

calibration:
  reference_cell_file: 71889_L_IPCE_NIST.csv
  active_incident_beam_file: null
  grating_change_nm: 850

# Hardware configuration.
#
# `active_profile` selects one entry from `profiles` below; that profile is
# translated into the logical reference_meter/test_meter/monochromator
# roles the measurement engine uses (see core/instruments/factory.py).
# Switching hardware setups (e.g. back to the Keithley 2600) means changing
# `active_profile` here -- no code changes needed.
instruments:
  mono_port: "COM2"

  active_profile: keithley2000_2400

  profiles:
    # Current replacement hardware: the Keithley 2600 is out of service.
    # Reference signal -> Keithley 2000, test-cell signal + bias -> Keithley 2400.
    # Connection settings below match the tested drivers/notebooks in
    # C:\Users\dreickem\Documents\code\test.
    keithley2000_2400:
      reference_meter:
        driver: keithley2000
        connection:
          type: serial
          port: COM10
          baudrate: 9600
        # NPLC=5 (was 1): this Keithley 2000's DC current function only has
        # one range (0.01 A / 10 mA -- confirmed on real hardware, it
        # clamps any smaller requested range back to this), which is far
        # larger than the reference cell's actual signal (~10s of nA to a
        # few uA), especially at the weaker ends of a wavelength sweep. On
        # real hardware, raising NPLC from 1 to 5 measured ~5x lower
        # relative noise at a weak-signal point (350 nm: 2.4% -> 0.5%);
        # NPLC=10 measured no further improvement for ~2x the time, so 5 is
        # the better trade-off. Investigated 2026-08-14 after a noisy
        # Si71889 calibration measurement.
        nplc: 5.0
        # Autorange: harmless and correct in general, even though it made
        # no difference on this specific instrument (see above) -- keeps
        # working correctly if the reference meter is ever swapped for a
        # model with more current ranges. current_range is only used as a
        # fixed range if autorange is set to false.
        autorange: true
        current_range: 0.01
        samples: 1

      test_meter:
        driver: keithley2400
        connection:
          type: serial
          resource: "ASRL8::INSTR"
          baud_rate: 9600
        # NPLC=5, samples=1 (was NPLC=1, samples=3): matches the reference
        # meter's Keithley 2000 above exactly, so a single reading on each
        # instrument covers the same integration duration. Combined with
        # the measurement engine now triggering both reads from two
        # threads at once (perform_measurement/perform_live_monitoring's
        # _measure_simultaneously), the reference and test-cell currents
        # are read over (approximately) the same slice of time instead of
        # sequentially, one after the other -- so a fluctuating Xenon lamp
        # affects both readings the same way and mostly cancels out of the
        # EQE ratio, rather than leaking in as noise. Added 2026-08-19.
        nplc: 5.0
        samples: 1
        current_compliance: 0.01
        ramp_steps: 10
        ramp_delay_s: 0.05
        # False (was true): letting every single reading discard one
        # extra sample made this meter always take longer than the
        # reference meter and, more importantly, meant it could never be
        # triggered at the same instant as the reference read (see above).
        # Autorange resettling after a wavelength move is now handled
        # once per move instead, via settle() (see keithley2400.py) --
        # called by the engine right after each wavelength move, before
        # the simultaneous "real" reading pair.
        discard_first_reading: false
        # Match the Keithley 2600 path's near-compliance warning threshold
        # (smu.py hardcodes 0.95 -- protected/untouched). The 2400 driver
        # defaults to 0.98 standalone; overridden here so a scan reports a
        # compliance warning at the same margin regardless of which
        # hardware profile is active.
        compliance_fraction: 0.95
        # The connection is kept open across scans (no reconnect between
        # measurements). If a new scan starts at a much smaller current
        # than the previous one ended at, current autorange can take
        # several range steps to settle on the first settle() reading --
        # longer than the driver's standalone 5 s default comfortably
        # covers. Give it more headroom here.
        timeout_ms: 15000

    # Original hardware: one Keithley 2600, channel A = reference,
    # channel B = test cell + bias. Both roles share a single VISA session.
    keithley2600:
      resource: "GPIB1::24::INSTR"
      N: 500
      nplc: 0.01
      interval: 0.002

      reference_meter:
        driver: keithley2600
        channel: A

      test_meter:
        driver: keithley2600
        channel: B

measurement:
  N: 500
  nplc: 0.01
  interval: 0.002
