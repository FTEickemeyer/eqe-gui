[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eqe-gui"
version = "1.5.5"
description = "EQE/IPCE measurement GUI for photovoltaic devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.10,<7",
    "numpy>=2.4,<3",
    "pandas>=3.0,<4",
    "matplotlib>=3.10,<4",
    "pyserial>=3.5,<4",
    "PyVISA>=1.16,<2",
    # PyVISA itself only defines the API -- it needs a *backend* to
    # actually talk to an instrument, and does not ship one. On this dev
    # machine that's silently supplied by National Instruments' NI-VISA,
    # a system-level Windows install (visa32.dll/visa64.dll), not
    # anything pip-installed or declared here -- so `pyvisa.ResourceManager()`
    # (used unconditionally by keithley2400.py and keithley2000.py's GPIB
    # path) "just works" here and fails elsewhere with "Could not locate
    # a VISA implementation" on any machine without NI-VISA (or another
    # IVI implementation) installed. pyvisa-py is a pure-Python backend
    # PyVISA automatically falls back to when no system VISA library is
    # found (confirmed: leaves NI-VISA as the preferred backend
    # unchanged on this machine, and independently opens this project's
    # actual serial resources, e.g. ASRL8::INSTR for the Keithley 2400)
    # -- covers every resource the active keithley2000_2400 profile uses
    # (both meters are serial/ASRL) without requiring any separate,
    # non-pip driver install. The keithley2600 fallback profile talks
    # GPIB, which still needs a real GPIB driver (bundled with NI-VISA or
    # similar) either way -- pyvisa-py doesn't provide one itself.
    "pyvisa-py>=0.7,<1",
    "PyYAML>=6.0,<7",
    "fte-analysis-libraries @ git+https://github.com/FTEickemeyer/FTE-analysis-libraries.git@6d17ae96e6a3a8b9a112aff2779e378518ef1bcb",
    # Not imported directly by eqe-gui -- pandas needs it to read the
    # legacy .xls AM1.5 reference-spectrum file bundled inside
    # fte-analysis-libraries (Spectrum.load_astmg173(), used for the
    # "Integrated current" column). fte-analysis-libraries doesn't
    # declare this dependency itself, so a fresh install silently has
    # working EQE but "Integrated current" always 0.0 -- the AM1.5
    # spectrum load fails and measurement_engine.py's integration step
    # (now: warns once and) falls back to 0.0. Only present here
    # incidentally on a dev machine that happens to have it installed
    # for something else, which is exactly why this bit a colleague's
    # fresh pip install and not this account -- pin it explicitly.
    "xlrd>=2.0.1,<3",
]

# Lets colleagues run the GUI as a plain command after installing
# (`eqe`), instead of needing `python -m eqe`. Both keep working.
#
# gui-scripts (not scripts/console_scripts) so pip generates a
# windowed eqe.exe launcher (pythonw.exe-based) on Windows -- running
# `eqe` never pops up a console window alongside the GUI. `python -m
# eqe` is unaffected either way and still runs in whatever console you
# launched it from. See gui_qt.py's _redirect_stdio_for_windowed_launch
# for why this needs a stdout/stderr fallback.
[project.gui-scripts]
eqe = "eqe.app.gui_qt:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Non-.py files the package needs at runtime (config defaults, the
# reference-cell IPCE curve, the window icon). Listed explicitly rather
# than "*.yaml" so a personal, gitignored config_local.yaml can never end
# up bundled into a build even if one happens to exist on disk at build
# time (e.g. building directly from a working copy instead of a fresh git
# clone) -- see config/load_config.py for where per-machine config
# actually lives.
[tool.setuptools.package-data]
"eqe.config" = ["config_default.yaml", "config_local_example.yaml"]
"eqe.resources.calibration_defaults" = ["*.csv"]
"eqe.app.assets" = ["*.ico"]

# Belt-and-suspenders on top of the explicit list above: setuptools'
# default auto-discovery of package data can still pick up files that
# are merely *present* in a package directory at build time regardless
# of the list above, so a personal config_local.yaml sitting next to
# config_default.yaml (as it does on every dev checkout, including this
# one) needs an explicit exclude too, or a build run directly from a
# working copy (as opposed to a clean git clone, which never has this
# gitignored file to begin with) would bundle it.
[tool.setuptools.exclude-package-data]
"eqe.config" = ["config_local.yaml"]
